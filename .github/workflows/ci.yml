name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path examples/streaming-api/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path examples/streaming-api/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path examples/streaming-api/Cargo.toml --all-targets
