[package]
name = "axum-streaming-api-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5"

[dev-dependencies]
http-body-util = "0.1"
